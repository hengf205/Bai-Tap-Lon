<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Thông tin phòng')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="@{/admin/rooms}" class="text-decoration-none">← Phòng</a><h1 class="page-title mt-2" th:text="${room.id == null ? 'Thêm phòng' : 'Cập nhật phòng'}"></h1></div><section class="panel"><form method="post" th:action="@{/admin/rooms/save}" th:object="${room}" class="row g-3"><input type="hidden" th:field="*{id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-6"><label class="form-label">Tầng</label><select class="form-select" th:field="*{floorId}"><option value="">Chọn tầng</option><option th:each="f : ${floors}" th:value="${f.id}" th:text="${f.building.buildingName + ' - Tầng ' + f.floorNumber}"></option></select><div class="text-danger small" th:errors="*{floorId}"></div></div><div class="col-md-6"><label class="form-label">Mã phòng</label><input class="form-control" th:field="*{roomCode}" maxlength="20"><div class="text-danger small" th:errors="*{roomCode}"></div></div><div class="col-md-4"><label class="form-label">Loại phòng</label><select class="form-select" th:field="*{roomType}"><option value="">Chọn loại</option><option th:each="t : ${roomTypes}" th:value="${t}" th:text="${@displayLabels.label(t)}"></option></select><div class="text-danger small" th:errors="*{roomType}"></div></div><div class="col-md-4"><label class="form-label">Sức chứa</label><input class="form-control" type="number" min="1" max="20" th:field="*{capacity}"><div class="text-danger small" th:errors="*{capacity}"></div></div><div class="col-md-4"><label class="form-label">Giá phòng/tháng</label><input class="form-control" type="number" min="1" step="1000" th:field="*{price}"><div class="text-danger small" th:errors="*{price}"></div></div><div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}"></option></select></div><div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" rows="3" th:field="*{description}"></textarea></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">Lưu phòng</button><a class="btn btn-light" th:href="@{/admin/rooms}">Hủy</a></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
