<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Phòng')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><h1 class="page-title">Quản lý phòng</h1><p class="page-subtitle mb-0">Tìm kiếm và theo dõi tình trạng phòng</p><a class="btn btn-primary" href="/admin/rooms/new">Thêm phòng</a></div><section class="panel"><form class="filter-bar mb-3" method="get"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Mã phòng"><select class="form-select" name="buildingId"><option value="">Tất cả tòa nhà</option><option th:each="b : ${buildings}" th:value="${b.id}" th:text="${b.buildingName}" th:selected="${b.id == buildingId}"></option></select><select class="form-select" name="status"><option value="">Tất cả trạng thái</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}" th:selected="${s == selectedStatus}"></option></select><select class="form-select" name="roomType"><option value="">Tất cả loại phòng</option><option th:each="t : ${roomTypes}" th:value="${t}" th:text="${@displayLabels.label(t)}" th:selected="${t == selectedRoomType}"></option></select><button class="btn btn-primary">Lọc</button><a class="btn btn-light" th:href="@{/admin/rooms}">Xóa lọc</a></form><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Mã phòng</th><th>Loại</th><th>Sức chứa</th><th>Giá/tháng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="r : ${roomPage.content}"><td class="fw-semibold" th:text="${r.roomCode}"></td><td th:text="${@displayLabels.label(r.roomType)}"></td><td th:text="${r.capacity}"></td><td th:text="${#numbers.formatDecimal(r.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td><span class="badge" th:classappend="${r.status.name() == 'AVAILABLE' ? ' text-bg-success' : (r.status.name() == 'MAINTENANCE' ? ' text-bg-secondary' : (r.status.name() == 'FULL' ? ' text-bg-danger' : ' text-bg-warning'))}" th:text="${@displayLabels.label(r.status)}"></span></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/rooms/{id}/edit(id=${r.id})}">Sửa</a> <form class="d-inline" method="post" th:action="@{/admin/rooms/{id}/delete(id=${r.id})}" data-confirm="Xóa phòng này?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr><tr th:if="${roomPage.empty}"><td colspan="5" class="empty-state">Chưa có phòng phù hợp.</td></tr></tbody></table></div><nav th:if="${roomPage.totalPages > 1}"><ul class="pagination justify-content-end"><li class="page-item" th:classappend="${roomPage.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/rooms(page=${roomPage.number - 1},keyword=${keyword},status=${selectedStatus},roomType=${selectedRoomType},buildingId=${buildingId})}">Trước</a></li><li class="page-item" th:each="n : ${#numbers.sequence(0, roomPage.totalPages - 1)}" th:classappend="${n == roomPage.number ? 'active' : ''}"><a class="page-link" th:href="@{/admin/rooms(page=${n},keyword=${keyword},status=${selectedStatus},roomType=${selectedRoomType},buildingId=${buildingId})}" th:text="${n + 1}"></a></li><li class="page-item" th:classappend="${roomPage.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/rooms(page=${roomPage.number + 1},keyword=${keyword},status=${selectedStatus},roomType=${selectedRoomType},buildingId=${buildingId})}">Sau</a></li></ul></nav></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
