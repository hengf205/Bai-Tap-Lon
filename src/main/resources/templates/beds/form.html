<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Thông tin giường')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="@{/admin/beds}" class="text-decoration-none">← Giường</a><h1 class="page-title mt-2">Thông tin giường</h1></div><section class="panel"><form method="post" th:action="@{/admin/beds/save}" th:object="${bed}" class="row g-3"><input type="hidden" th:field="*{id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-6"><label class="form-label">Phòng</label><select class="form-select" th:field="*{room.id}"><option value="">Chọn phòng</option><option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.roomCode}"></option></select><div class="text-danger small" th:errors="*{room}"></div></div><div class="col-md-6"><label class="form-label">Mã giường</label><input class="form-control" th:field="*{bedCode}" maxlength="20"><div class="text-danger small" th:errors="*{bedCode}"></div></div><div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}"></option></select></div><div class="col-12"><button class="btn btn-primary">Lưu giường</button></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
