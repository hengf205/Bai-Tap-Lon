<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Giường')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="d-flex justify-content-between align-items-end mb-4"><div><h1 class="page-title">Quản lý giường</h1><p class="page-subtitle mb-0">Theo dõi giường theo phòng và trạng thái sử dụng</p></div><a class="btn btn-primary" th:href="@{/admin/beds/new}">Thêm giường</a></div><section class="panel"><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Mã giường</th><th>Phòng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="b : ${bedPage.content}"><td th:text="${b.bedCode}"></td><td th:text="${b.room.roomCode}"></td><td th:text="${@displayLabels.label(b.status)}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/beds/{id}/edit(id=${b.id})}">Sửa</a><form class="d-inline" method="post" th:action="@{/admin/beds/{id}/delete(id=${b.id})}" data-confirm="Xóa giường này?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr><tr th:if="${bedPage.empty}"><td colspan="4" class="empty-state">Chưa có giường.</td></tr></tbody></table></div></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
