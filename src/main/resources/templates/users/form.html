<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Thông tin tài khoản')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="@{/admin/users}" class="text-decoration-none">← Tài khoản</a><h1 class="page-title mt-2" th:text="${user.id == null ? 'Tạo tài khoản' : 'Cập nhật tài khoản'}"></h1></div><section class="panel"><form method="post" th:action="@{/admin/users/save}" th:object="${user}" class="row g-3"><input type="hidden" th:field="*{id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-6"><label class="form-label">Tên đăng nhập</label><input class="form-control" th:field="*{username}" autocomplete="off"><div class="text-danger small" th:errors="*{username}"></div></div><div class="col-md-6"><label class="form-label">Họ tên</label><input class="form-control" th:field="*{fullName}"><div class="text-danger small" th:errors="*{fullName}"></div></div><div class="col-md-6"><label class="form-label">Mật khẩu <span th:if="${user.id != null}" class="text-secondary">(để trống nếu không đổi)</span></label><input class="form-control" type="password" th:field="*{password}" autocomplete="new-password"><div class="text-danger small" th:errors="*{password}"></div></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}"><div class="text-danger small" th:errors="*{email}"></div></div><div class="col-md-6"><label class="form-label">Điện thoại</label><input class="form-control" th:field="*{phone}"><div class="text-danger small" th:errors="*{phone}"></div></div><div class="col-md-6"><label class="form-label">Vai trò</label><select class="form-select" th:field="*{role}"><option value="">Chọn vai trò</option><option th:each="r : ${roles}" th:value="${r}" th:text="${@displayLabels.label(r)}"></option></select><div class="text-danger small" th:errors="*{role}"></div></div><div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}"></option></select></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">Lưu tài khoản</button><a class="btn btn-light" th:href="@{/admin/users}">Hủy</a></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
