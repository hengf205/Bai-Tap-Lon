<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Tài khoản')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="d-flex justify-content-between align-items-end mb-4"><div><h1 class="page-title">Quản lý tài khoản</h1><p class="page-subtitle mb-0">Quản lý quyền truy cập của quản trị viên, quản lý và người thuê</p></div><a class="btn btn-primary" th:href="@{/admin/users/new}">Thêm tài khoản</a></div><section class="panel"><form class="filter-bar mb-3" method="get"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tên, tên đăng nhập hoặc email"><select class="form-select" name="role"><option value="">Mọi vai trò</option><option th:each="r : ${roles}" th:value="${r}" th:text="${@displayLabels.label(r)}" th:selected="${r == selectedRole}"></option></select><button class="btn btn-primary">Tìm kiếm</button></form><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Email</th><th>Điện thoại</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="u : ${userPage.content}"><td class="fw-semibold" th:text="${u.username}"></td><td th:text="${u.fullName}"></td><td th:text="${u.email ?: '—'}"></td><td th:text="${u.phone ?: '—'}"></td><td th:text="${@displayLabels.label(u.role)}"></td><td th:text="${@displayLabels.label(u.status)}"></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/users/{id}/edit(id=${u.id})}">Sửa</a> <form class="d-inline" method="post" th:action="@{/admin/users/{id}/delete(id=${u.id})}" data-confirm="Xóa tài khoản này?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr><tr th:if="${userPage.empty}"><td colspan="7" class="empty-state">Chưa có tài khoản.</td></tr></tbody></table></div></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
