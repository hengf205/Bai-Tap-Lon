<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Đổi mật khẩu')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><h1 class="page-title">Đổi mật khẩu</h1><p class="page-subtitle mb-4">Nhập mật khẩu hiện tại để xác nhận thay đổi</p><section class="panel" style="max-width: 680px"><div class="alert alert-success" th:if="${passwordChanged}">Đổi mật khẩu thành công.</div><form method="post" th:action="@{/tenant/password}" th:object="${changePassword}" class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-12"><label class="form-label">Mật khẩu hiện tại</label><input class="form-control" type="password" th:field="*{currentPassword}" autocomplete="current-password"><div class="text-danger small" th:errors="*{currentPassword}"></div></div><div class="col-12"><label class="form-label">Mật khẩu mới</label><input class="form-control" type="password" th:field="*{newPassword}" autocomplete="new-password"><div class="text-danger small" th:errors="*{newPassword}"></div></div><div class="col-12"><label class="form-label">Xác nhận mật khẩu mới</label><input class="form-control" type="password" th:field="*{confirmPassword}" autocomplete="new-password"><div class="text-danger small" th:errors="*{confirmPassword}"></div></div><div class="col-12"><button class="btn btn-primary">Cập nhật mật khẩu</button></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
