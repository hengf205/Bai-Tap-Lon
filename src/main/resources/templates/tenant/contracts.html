<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Hợp đồng của tôi')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><h1 class="page-title">Hợp đồng của tôi</h1><p class="page-subtitle mb-4">Danh sách hợp đồng gắn với tài khoản của bạn</p><section class="panel"><div th:if="${#lists.isEmpty(contracts)}" class="empty-state">Bạn chưa có hợp đồng.</div><div class="table-responsive" th:unless="${#lists.isEmpty(contracts)}"><table class="table align-middle"><thead><tr><th>Mã hợp đồng</th><th>Phòng</th><th>Giường</th><th>Ngày bắt đầu</th><th>Ngày kết thúc</th><th>Giá/tháng</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="c : ${contracts}"><td th:text="${c.contractCode}"></td><td th:text="${c.room.roomCode}"></td><td th:text="${c.bed == null ? '—' : c.bed.bedCode}"></td><td th:text="${c.startDate}"></td><td th:text="${c.endDate}"></td><td th:text="${#numbers.formatDecimal(c.monthlyPrice, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></td><td><span class="badge text-bg-light" th:text="${@displayLabels.label(c.status)}"></span></td></tr></tbody></table></div></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
