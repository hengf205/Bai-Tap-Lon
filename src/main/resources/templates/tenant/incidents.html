<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Sự cố của tôi')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4"><div><h1 class="page-title">Sự cố của tôi</h1><p class="page-subtitle mb-0">Theo dõi các yêu cầu hỗ trợ đã gửi</p></div><a class="btn btn-primary" th:href="@{/tenant/incidents/new}"><i class="fa-solid fa-plus me-1"></i> Báo sự cố</a></div><section class="panel"><div th:if="${#lists.isEmpty(incidents)}" class="empty-state">Bạn chưa gửi báo cáo sự cố nào.</div><div class="table-responsive" th:unless="${#lists.isEmpty(incidents)}"><table class="table align-middle"><thead><tr><th>Tiêu đề</th><th>Phòng</th><th>Ưu tiên</th><th>Ngày gửi</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="i : ${incidents}"><td><div class="fw-semibold" th:text="${i.title}"></div><div class="small text-secondary" th:text="${i.description}"></div></td><td th:text="${i.room.roomCode}"></td><td th:text="${@displayLabels.label(i.priority)}"></td><td th:text="${#temporals.format(i.createdAt, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${@displayLabels.label(i.status)}"></td></tr></tbody></table></div></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
