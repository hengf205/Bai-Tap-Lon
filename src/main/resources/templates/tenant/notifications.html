<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Thông báo')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="d-flex justify-content-between align-items-start gap-3 mb-4"><div><h1 class="page-title">Thông báo</h1><p class="page-subtitle mb-0">Thông báo dành cho tài khoản của bạn</p></div><form method="post" th:action="@{/tenant/notifications/read-all}" th:if="${!#lists.isEmpty(notifications)}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline-primary">Đánh dấu tất cả đã đọc</button></form></div><section class="panel"><div th:if="${#lists.isEmpty(notifications)}" class="empty-state">Bạn chưa có thông báo.</div><article class="border-bottom py-3" th:each="n : ${notifications}"><div class="d-flex justify-content-between gap-3"><div><div class="fw-semibold" th:text="${n.title}"></div><div class="text-secondary mt-1" th:text="${n.content}"></div><div class="small text-secondary mt-2" th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}"></div></div><div class="text-end"><span class="badge" th:classappend="${n.isRead ? ' text-bg-light' : ' text-bg-primary'}" th:text="${n.isRead ? 'Đã đọc' : 'Mới'}"></span><form th:if="${!n.isRead}" method="post" th:action="@{/tenant/notifications/{id}/read(id=${n.id})}" class="mt-2"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary">Đánh dấu đã đọc</button></form></div></div></article></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
