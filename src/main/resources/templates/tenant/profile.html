<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Hồ sơ của tôi')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><h1 class="page-title">Hồ sơ của tôi</h1><p class="page-subtitle mb-4">Thông tin người thuê gắn với tài khoản đăng nhập</p><section class="panel"><dl class="row mb-0"><dt class="col-sm-4 text-secondary py-2">Mã sinh viên</dt><dd class="col-sm-8 py-2" th:text="${tenant.studentCode ?: '—'}"></dd><dt class="col-sm-4 text-secondary py-2">Họ và tên</dt><dd class="col-sm-8 py-2" th:text="${tenant.fullName}"></dd><dt class="col-sm-4 text-secondary py-2">Ngày sinh</dt><dd class="col-sm-8 py-2" th:text="${tenant.dateOfBirth ?: '—'}"></dd><dt class="col-sm-4 text-secondary py-2">Giới tính</dt><dd class="col-sm-8 py-2" th:text="${tenant.gender == null ? '—' : @displayLabels.label(tenant.gender)}"></dd><dt class="col-sm-4 text-secondary py-2">Số điện thoại</dt><dd class="col-sm-8 py-2" th:text="${tenant.phone ?: '—'}"></dd><dt class="col-sm-4 text-secondary py-2">Email</dt><dd class="col-sm-8 py-2" th:text="${tenant.email ?: '—'}"></dd><dt class="col-sm-4 text-secondary py-2">Trường</dt><dd class="col-sm-8 py-2" th:text="${campusSettings.institutionName}">Đại học Giao thông Vận tải</dd><dt class="col-sm-4 text-secondary py-2">Ngành học</dt><dd class="col-sm-8 py-2" th:text="${tenant.major ?: '—'}"></dd><dt class="col-sm-4 text-secondary py-2">Quê quán</dt><dd class="col-sm-8 py-2" th:text="${tenant.hometown ?: '—'}"></dd></dl><p class="small text-secondary mt-3 mb-0">Muốn sửa thông tin, vui lòng liên hệ ban quản lý.</p></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
