<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Phòng của tôi')}"></head><body>
<div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content">
<h1 class="page-title">Phòng của tôi</h1><p class="page-subtitle mb-4">Thông tin phòng theo hợp đồng đang hiệu lực</p>
<section class="panel" th:if="${contract == null}"><div class="empty-state">Bạn chưa có hợp đồng đang hiệu lực.</div></section>
<section class="panel" th:if="${contract != null}"><div class="row g-4"><div class="col-md-6"><h2 class="h5 fw-bold" th:text="${contract.room.roomCode}">Mã phòng</h2><p class="mb-1">Tòa nhà: <span th:text="${contract.room.floor.building.buildingName}"></span></p><p class="mb-1">Tầng: <span th:text="${contract.room.floor.floorNumber}"></span></p><p class="mb-1">Loại phòng: <span th:text="${@displayLabels.label(contract.room.roomType)}"></span></p><p class="mb-0">Sức chứa: <span th:text="${contract.room.capacity}"></span></p></div><div class="col-md-6"><p class="mb-1">Hợp đồng: <strong th:text="${contract.contractCode}"></strong></p><p class="mb-1">Thời hạn: <span th:text="${contract.startDate}"></span> – <span th:text="${contract.endDate}"></span></p><p class="mb-1">Tiền phòng/tháng: <strong th:text="${#numbers.formatDecimal(contract.monthlyPrice, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></strong></p><p class="mb-0">Trạng thái: <span class="badge text-bg-success" th:text="${@displayLabels.label(contract.status)}"></span></p></div></div><hr><h2 class="h6 fw-bold">Giường trong phòng</h2><div th:if="${#lists.isEmpty(beds)}" class="text-secondary">Chưa có thông tin giường.</div><div class="d-flex flex-wrap gap-2"><span th:each="bed : ${beds}" class="badge text-bg-light border" th:text="${bed.bedCode + ' · ' + @displayLabels.label(bed.status)}"></span></div></section>
</main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
