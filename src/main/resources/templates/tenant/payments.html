<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Lịch sử thanh toán')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><h1 class="page-title">Lịch sử thanh toán</h1><p class="page-subtitle mb-4">Các giao dịch thuộc hóa đơn của bạn</p><section class="panel"><div th:if="${#lists.isEmpty(payments)}" class="empty-state">Chưa có giao dịch thanh toán.</div><div class="table-responsive" th:unless="${#lists.isEmpty(payments)}"><table class="table align-middle"><thead><tr><th>Mã giao dịch</th><th>Hóa đơn</th><th>Số tiền</th><th>Phương thức</th><th>Thời gian</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="p : ${payments}"><td th:text="${p.paymentCode}"></td><td th:text="${p.invoice.invoiceCode}"></td><td th:text="${#numbers.formatDecimal(p.amount, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></td><td th:text="${@displayLabels.label(p.paymentMethod)}"></td><td th:text="${p.paymentDate == null ? '—' : #temporals.format(p.paymentDate, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${@displayLabels.label(p.status)}"></td></tr></tbody></table></div></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
