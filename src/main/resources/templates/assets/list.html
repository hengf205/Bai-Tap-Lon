<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Tài sản')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="d-flex justify-content-between align-items-end mb-4"><div><h1 class="page-title">Tài sản phòng</h1><p class="page-subtitle mb-0">Theo dõi số lượng và tình trạng tài sản</p></div><a class="btn btn-primary" th:href="@{/admin/assets/new}">Thêm tài sản</a></div><section class="panel"><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Tài sản</th><th>Phòng</th><th>Số lượng</th><th>Tình trạng</th><th>Ngày mua</th><th>Thao tác</th></tr></thead><tbody><tr th:each="a : ${assetPage.content}"><td class="fw-semibold" th:text="${a.assetName}"></td><td th:text="${a.room.roomCode}"></td><td th:text="${a.quantity}"></td><td th:text="${@displayLabels.label(a.conditionStatus)}"></td><td th:text="${a.purchaseDate ?: '—'}"></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/assets/{id}/edit(id=${a.id})}">Sửa</a> <form class="d-inline" method="post" th:action="@{/admin/assets/{id}/delete(id=${a.id})}" data-confirm="Xóa tài sản này?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr><tr th:if="${assetPage.empty}"><td colspan="6" class="empty-state">Chưa có tài sản.</td></tr></tbody></table></div></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
