<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Thông tin tài sản')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="@{/admin/assets}" class="text-decoration-none">← Tài sản</a><h1 class="page-title mt-2">Thông tin tài sản</h1></div><section class="panel"><form method="post" th:action="@{/admin/assets/save}" th:object="${asset}" class="row g-3"><input type="hidden" th:field="*{id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-6"><label class="form-label">Phòng</label><select class="form-select" th:field="*{roomId}"><option value="">Chọn phòng</option><option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.roomCode}"></option></select><div class="text-danger small" th:errors="*{roomId}"></div></div><div class="col-md-6"><label class="form-label">Tên tài sản</label><input class="form-control" th:field="*{assetName}"><div class="text-danger small" th:errors="*{assetName}"></div></div><div class="col-md-4"><label class="form-label">Số lượng</label><input class="form-control" type="number" min="1" th:field="*{quantity}"><div class="text-danger small" th:errors="*{quantity}"></div></div><div class="col-md-4"><label class="form-label">Tình trạng</label><select class="form-select" th:field="*{conditionStatus}"><option th:each="c : ${conditions}" th:value="${c}" th:text="${@displayLabels.label(c)}"></option></select></div><div class="col-md-4"><label class="form-label">Ngày mua</label><input class="form-control" type="date" th:field="*{purchaseDate}"></div><div class="col-12"><label class="form-label">Ghi chú</label><textarea class="form-control" th:field="*{note}" rows="3"></textarea></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">Lưu tài sản</button><a class="btn btn-light" th:href="@{/admin/assets}">Hủy</a></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
