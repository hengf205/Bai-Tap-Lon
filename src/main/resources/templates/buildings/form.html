<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Thông tin tòa nhà')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="@{/admin/buildings}" class="text-decoration-none">← Tòa nhà</a><h1 class="page-title mt-2" th:text="${building.id == null ? 'Thêm tòa nhà' : 'Cập nhật tòa nhà'}"></h1><p class="page-subtitle mb-0">Chỉ khai báo các tòa thuộc khu ký túc xá <span th:text="${campusSettings.institutionName}">Đại học Giao thông Vận tải</span>.</p></div><section class="panel"><form method="post" th:action="@{/admin/buildings/save}" th:object="${building}" class="row g-3"><input type="hidden" th:field="*{id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-6"><label class="form-label">Mã tòa nhà</label><input class="form-control" th:field="*{buildingCode}" maxlength="20"><div class="text-danger small" th:errors="*{buildingCode}"></div></div><div class="col-md-6"><label class="form-label">Tên tòa nhà</label><input class="form-control" th:field="*{buildingName}" maxlength="100"><div class="text-danger small" th:errors="*{buildingName}"></div></div><div class="col-md-8"><label class="form-label">Địa chỉ</label><input class="form-control" th:field="*{address}" maxlength="255"><div class="text-danger small" th:errors="*{address}"></div></div><div class="col-md-4"><label class="form-label">Số tầng</label><input class="form-control" type="number" min="1" max="100" th:field="*{numberOfFloors}"><div class="text-danger small" th:errors="*{numberOfFloors}"></div></div><div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}"></option></select></div><div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" rows="3" th:field="*{description}"></textarea></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">Lưu tòa nhà</button><a class="btn btn-light" th:href="@{/admin/buildings}">Hủy</a></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
