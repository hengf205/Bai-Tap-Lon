<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Chi tiết tòa nhà')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="@{/admin/buildings}" class="text-decoration-none">← Tòa nhà</a><h1 class="page-title mt-2" th:text="${building.buildingName}"></h1><p class="page-subtitle" th:text="${building.address}"></p><a class="btn btn-outline-primary btn-sm" th:href="@{/admin/buildings/{id}/edit(id=${building.id})}">Sửa thông tin</a></div><section class="panel mb-3" th:each="floor : ${floors}"><h2 class="h5 fw-bold">Tầng <span th:text="${floor.floorNumber}"></span></h2><div class="row g-3"><div class="col-xl-6" th:each="room : ${floor.rooms}"><div class="border rounded-3 p-3 h-100"><div class="d-flex justify-content-between"><strong th:text="${'Phòng ' + room.roomCode}"></strong><span class="badge text-bg-light" th:text="${@displayLabels.label(room.status)}"></span></div><div class="small text-secondary mt-2">Giường</div><div class="d-flex flex-wrap gap-2 mt-1"><span class="badge" th:each="bed : ${bedsByRoom[room.id]}" th:classappend="${bed.status.name() == 'AVAILABLE' ? ' text-bg-success' : (bed.status.name() == 'OCCUPIED' ? ' text-bg-primary' : ' text-bg-secondary')}" th:text="${bed.bedCode + (tenantByBed[bed.id] == null ? '' : ' — ' + tenantByBed[bed.id])}"></span><span th:if="${#lists.isEmpty(bedsByRoom[room.id])}" class="small text-secondary">Chưa bố trí giường</span></div></div></div><div th:if="${#lists.isEmpty(floor.rooms)}" class="text-secondary">Tầng này chưa có phòng.</div></div></section><div th:if="${#lists.isEmpty(floors)}" class="panel empty-state">Tòa nhà chưa có tầng.</div></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
