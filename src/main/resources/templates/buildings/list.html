<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout-head :: head('Tòa nhà')}"></head>
<body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="main-content"><div class="mb-4"><h1 class="page-title">Quản lý tòa nhà <span th:text="${campusSettings.bannerTitle}">ký túc xá UTC</span></h1><p class="page-subtitle mb-0">Danh sách các tòa thuộc khu ký túc xá <span th:text="${campusSettings.institutionName}">Đại học Giao thông Vận tải</span></p><a class="btn btn-primary" href="/admin/buildings/new">Thêm tòa nhà</a></div>
<section class="panel"><form class="filter-bar mb-3" method="get"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên hoặc mã tòa"><select class="form-select" name="status"><option value="">Tất cả trạng thái</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}" th:selected="${s == selectedStatus}"></option></select><button class="btn btn-primary">Tìm kiếm</button><a class="btn btn-light" th:href="@{/admin/buildings}">Xóa lọc</a></form>
<div class="table-responsive"><table class="table table-hover"><thead><tr><th>Mã tòa</th><th>Tên tòa</th><th>Địa chỉ</th><th>Số tầng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="b : ${buildingPage.content}"><td class="fw-semibold" th:text="${b.buildingCode}"></td><td th:text="${b.buildingName}"></td><td th:text="${b.address ?: '—'}"></td><td th:text="${b.numberOfFloors}"></td><td><span class="badge text-bg-success badge-status" th:text="${@displayLabels.label(b.status)}"></span></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/buildings/{id}(id=${b.id})}">Chi tiết</a> <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/buildings/{id}/edit(id=${b.id})}">Sửa</a> <form class="d-inline" method="post" th:action="@{/admin/buildings/{id}/delete(id=${b.id})}" data-confirm="Xóa tòa nhà này?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr><tr th:if="${buildingPage.empty}"><td colspan="5" class="empty-state">Chưa có tòa nhà phù hợp.</td></tr></tbody></table></div>
<nav th:if="${buildingPage.totalPages > 1}"><ul class="pagination justify-content-end"><li class="page-item" th:classappend="${buildingPage.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/buildings(page=${buildingPage.number - 1},keyword=${keyword},status=${selectedStatus})}">Trước</a></li><li class="page-item" th:each="n : ${#numbers.sequence(0, buildingPage.totalPages - 1)}" th:classappend="${n == buildingPage.number ? 'active' : ''}"><a class="page-link" th:href="@{/admin/buildings(page=${n},keyword=${keyword},status=${selectedStatus})}" th:text="${n + 1}"></a></li><li class="page-item" th:classappend="${buildingPage.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/buildings(page=${buildingPage.number + 1},keyword=${keyword},status=${selectedStatus})}">Sau</a></li></ul></nav></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
