<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Tầng')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="d-flex justify-content-between align-items-end mb-4"><div><h1 class="page-title">Quản lý tầng</h1><p class="page-subtitle mb-0">Sắp xếp tầng theo từng tòa nhà</p></div><a class="btn btn-primary" th:href="@{/admin/floors/new}">Thêm tầng</a></div><section class="panel"><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Tòa nhà</th><th>Tầng</th><th>Mô tả</th><th>Thao tác</th></tr></thead><tbody><tr th:each="f : ${floors}"><td th:text="${f.building.buildingName}"></td><td th:text="${f.floorNumber}"></td><td th:text="${f.description ?: '—'}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/floors/{id}/edit(id=${f.id})}">Sửa</a><form class="d-inline" method="post" th:action="@{/admin/floors/{id}/delete(id=${f.id})}" data-confirm="Xóa tầng này?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr><tr th:if="${#lists.isEmpty(floors)}"><td colspan="4" class="empty-state">Chưa có tầng.</td></tr></tbody></table></div></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
