<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Thông tin tầng')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="@{/admin/floors}" class="text-decoration-none">← Tầng</a><h1 class="page-title mt-2">Thông tin tầng</h1></div><section class="panel"><form method="post" th:action="@{/admin/floors/save}" th:object="${floor}" class="row g-3"><input type="hidden" th:field="*{id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-6"><label class="form-label">Tòa nhà</label><select class="form-select" th:field="*{building.id}"><option value="">Chọn tòa nhà</option><option th:each="b : ${buildings}" th:value="${b.id}" th:text="${b.buildingName}"></option></select><div class="text-danger small" th:errors="*{building}"></div></div><div class="col-md-6"><label class="form-label">Số tầng</label><input class="form-control" type="number" min="1" th:field="*{floorNumber}"><div class="text-danger small" th:errors="*{floorNumber}"></div></div><div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" rows="3" th:field="*{description}"></textarea></div><div class="col-12"><button class="btn btn-primary">Lưu tầng</button></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
