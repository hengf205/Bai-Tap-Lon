<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Điện nước')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="d-flex justify-content-between align-items-end mb-4"><div><h1 class="page-title">Chỉ số điện nước</h1><p class="page-subtitle mb-0">Theo dõi định mức sử dụng theo phòng</p></div><a class="btn btn-primary" th:href="@{/admin/utilities/new}">Ghi chỉ số mới</a></div><section class="panel"><form class="filter-bar mb-3" method="get"><select class="form-select" name="roomId"><option value="">Tất cả phòng</option><option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.roomCode}" th:selected="${r.id == roomId}"></option></select><label class="visually-hidden" for="fromDate">Từ ngày</label><input class="form-control" type="date" name="fromDate" id="fromDate" th:value="${fromDate}"><label class="visually-hidden" for="toDate">Đến ngày</label><input class="form-control" type="date" name="toDate" id="toDate" th:value="${toDate}"><button class="btn btn-primary">Lọc</button></form><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Phòng</th><th>Ngày ghi</th><th>Điện cũ → mới</th><th>Tiền điện</th><th>Nước cũ → mới</th><th>Tiền nước</th></tr></thead><tbody><tr th:each="m : ${meterPage.content}"><td th:text="${m.room.roomCode}"></td><td th:text="${m.recordingDate}"></td><td th:text="${m.electricityOld + ' → ' + m.electricityNew}"></td><td th:text="${#numbers.formatDecimal(m.electricityAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td th:text="${m.waterOld + ' → ' + m.waterNew}"></td><td th:text="${#numbers.formatDecimal(m.waterAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td></tr><tr th:if="${meterPage.empty}"><td colspan="6" class="empty-state">Chưa có bản ghi điện nước.</td></tr></tbody></table></div></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
