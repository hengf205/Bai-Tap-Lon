<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Ghi chỉ số điện nước')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="@{/admin/utilities}" class="text-decoration-none">← Điện nước</a><h1 class="page-title mt-2">Ghi chỉ số mới</h1></div><section class="panel"><form method="post" th:action="@{/admin/utilities/save}" th:object="${meter}" class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-6"><label class="form-label">Phòng</label><select class="form-select" th:field="*{roomId}"><option value="">Chọn phòng</option><option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.roomCode}"></option></select><div class="text-danger small" th:errors="*{roomId}"></div></div><div class="col-md-6"><label class="form-label">Ngày ghi</label><input class="form-control" type="date" th:field="*{recordingDate}"><div class="text-danger small" th:errors="*{recordingDate}"></div></div><div class="col-md-3"><label class="form-label">Điện cũ (kWh)</label><input class="form-control" type="number" step="0.01" min="0" th:field="*{electricityOld}"><div class="text-danger small" th:errors="*{electricityOld}"></div></div><div class="col-md-3"><label class="form-label">Điện mới (kWh)</label><input class="form-control" type="number" step="0.01" min="0" th:field="*{electricityNew}"><div class="text-danger small" th:errors="*{electricityNew}"></div></div><div class="col-md-3"><label class="form-label">Giá điện/kWh</label><input class="form-control" type="number" step="100" min="1" th:field="*{electricityPrice}"><div class="text-danger small" th:errors="*{electricityPrice}"></div></div><div class="col-md-3"><label class="form-label">Tiền điện</label><input class="form-control" disabled value="Tự tính khi lưu"></div><div class="col-md-3"><label class="form-label">Nước cũ (m³)</label><input class="form-control" type="number" step="0.01" min="0" th:field="*{waterOld}"><div class="text-danger small" th:errors="*{waterOld}"></div></div><div class="col-md-3"><label class="form-label">Nước mới (m³)</label><input class="form-control" type="number" step="0.01" min="0" th:field="*{waterNew}"><div class="text-danger small" th:errors="*{waterNew}"></div></div><div class="col-md-3"><label class="form-label">Giá nước/m³</label><input class="form-control" type="number" step="100" min="1" th:field="*{waterPrice}"><div class="text-danger small" th:errors="*{waterPrice}"></div></div><div class="col-md-3"><label class="form-label">Tiền nước</label><input class="form-control" disabled value="Tự tính khi lưu"></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">Lưu chỉ số</button><a class="btn btn-light" th:href="@{/admin/utilities}">Hủy</a></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
