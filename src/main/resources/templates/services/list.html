<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Dịch vụ')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="d-flex justify-content-between align-items-end mb-4"><div><h1 class="page-title">Danh mục dịch vụ</h1><p class="page-subtitle mb-0">Quản lý các dịch vụ và mức giá</p></div><a class="btn btn-primary" th:href="@{/admin/services/new}">Thêm dịch vụ</a></div><section class="panel"><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Tên dịch vụ</th><th>Đơn vị</th><th>Đơn giá</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="s : ${servicePage.content}"><td class="fw-semibold" th:text="${s.serviceName}"></td><td th:text="${s.unit ?: '—'}"></td><td th:text="${#numbers.formatDecimal(s.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td th:text="${@displayLabels.label(s.status)}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/services/{id}/edit(id=${s.id})}">Sửa</a> <form class="d-inline" method="post" th:action="@{/admin/services/{id}/delete(id=${s.id})}" data-confirm="Xóa dịch vụ này?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr><tr th:if="${servicePage.empty}"><td colspan="5" class="empty-state">Chưa có dịch vụ.</td></tr></tbody></table></div></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
