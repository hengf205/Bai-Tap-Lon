<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Thông tin dịch vụ')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="@{/admin/services}" class="text-decoration-none">← Dịch vụ</a><h1 class="page-title mt-2">Thông tin dịch vụ</h1></div><section class="panel"><form method="post" th:action="@{/admin/services/save}" th:object="${service}" class="row g-3"><input type="hidden" th:field="*{id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-6"><label class="form-label">Tên dịch vụ</label><input class="form-control" th:field="*{serviceName}"><div class="text-danger small" th:errors="*{serviceName}"></div></div><div class="col-md-6"><label class="form-label">Đơn vị</label><input class="form-control" th:field="*{unit}" placeholder="tháng, người, lần"></div><div class="col-md-6"><label class="form-label">Đơn giá</label><input class="form-control" type="number" min="0" step="1000" th:field="*{price}"><div class="text-danger small" th:errors="*{price}"></div></div><div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}"></option></select></div><div class="col-12"><label class="form-label">Mô tả</label><textarea class="form-control" rows="3" th:field="*{description}"></textarea></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">Lưu dịch vụ</button><a class="btn btn-light" th:href="@{/admin/services}">Hủy</a></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
