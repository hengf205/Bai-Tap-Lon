<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Thanh toán')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><h1 class="page-title">Lịch sử thanh toán</h1><p class="page-subtitle mb-0">Các giao dịch đã ghi nhận trong hệ thống</p><a class="btn btn-primary" href="/admin/payments/new">Ghi nhận thanh toán</a></div><section class="panel"><form class="filter-bar mb-3" method="get"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Mã thanh toán hoặc hóa đơn"><select class="form-select" name="method"><option value="">Mọi phương thức</option><option th:each="m : ${methods}" th:value="${m}" th:text="${@displayLabels.label(m)}" th:selected="${m == selectedMethod}"></option></select><select class="form-select" name="status"><option value="">Mọi trạng thái</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}" th:selected="${s == selectedStatus}"></option></select><button class="btn btn-primary">Lọc</button></form><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Mã giao dịch</th><th>Hóa đơn</th><th>Người thuê</th><th>Số tiền</th><th>Phương thức</th><th>Thời gian</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="p : ${paymentPage.content}"><td class="fw-semibold" th:text="${p.paymentCode}"></td><td th:text="${p.invoice.invoiceCode}"></td><td th:text="${p.invoice.contract.tenant.fullName}"></td><td th:text="${#numbers.formatDecimal(p.amount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td th:text="${@displayLabels.label(p.paymentMethod)}"></td><td th:text="${#temporals.format(p.paymentDate, 'dd/MM/yyyy HH:mm')}"></td><td><span class="badge text-bg-success" th:text="${@displayLabels.label(p.status)}"></span></td></tr><tr th:if="${paymentPage.empty}"><td colspan="7" class="empty-state">Chưa có giao dịch phù hợp.</td></tr></tbody></table></div><nav th:if="${paymentPage.totalPages > 1}"><ul class="pagination justify-content-end"><li class="page-item" th:classappend="${paymentPage.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/payments(page=${paymentPage.number - 1},keyword=${keyword},method=${selectedMethod},status=${selectedStatus})}">Trước</a></li><li class="page-item" th:each="n : ${#numbers.sequence(0, paymentPage.totalPages - 1)}" th:classappend="${n == paymentPage.number ? 'active' : ''}"><a class="page-link" th:href="@{/admin/payments(page=${n},keyword=${keyword},method=${selectedMethod},status=${selectedStatus})}" th:text="${n + 1}"></a></li><li class="page-item" th:classappend="${paymentPage.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/payments(page=${paymentPage.number + 1},keyword=${keyword},method=${selectedMethod},status=${selectedStatus})}">Sau</a></li></ul></nav></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
