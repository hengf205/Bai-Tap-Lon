<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Ghi nhận thanh toán')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="@{/admin/payments}" class="text-decoration-none">← Thanh toán</a><h1 class="page-title mt-2">Ghi nhận thanh toán</h1></div><section class="panel"><form method="post" th:action="@{/admin/payments/pay}" th:object="${payment}" class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-8"><label class="form-label">Hóa đơn chưa thanh toán</label><select class="form-select" th:field="*{invoiceId}" required><option value="">Chọn hóa đơn</option><option th:each="i : ${invoices}" th:value="${i.id}" th:text="${i.invoiceCode + ' — ' + i.totalAmount + ' ₫'}"></option></select><div class="text-danger small" th:errors="*{invoiceId}"></div></div><div class="col-md-4"><label class="form-label">Số tiền</label><input class="form-control" type="number" min="1" step="1000" th:field="*{amount}" required><div class="text-danger small" th:errors="*{amount}"></div></div><div class="col-md-6"><label class="form-label">Phương thức</label><select class="form-select" th:field="*{paymentMethod}" required><option value="">Chọn phương thức</option><option th:each="m : ${methods}" th:value="${m}" th:text="${@displayLabels.label(m)}"></option></select><div class="text-danger small" th:errors="*{paymentMethod}"></div></div><div class="col-md-6"><label class="form-label">Thời gian (để trống để dùng thời gian hiện tại)</label><input class="form-control" type="datetime-local" th:field="*{paymentDate}"></div><div class="col-12"><label class="form-label">Ghi chú</label><textarea class="form-control" rows="3" th:field="*{note}"></textarea></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">Xác nhận thanh toán</button><a class="btn btn-light" th:href="@{/admin/payments}">Hủy</a></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
