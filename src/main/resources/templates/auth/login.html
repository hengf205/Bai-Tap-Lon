<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${'Đăng nhập | ' + campusSettings.bannerTitle}">Đăng nhập | Ký túc xá UTC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: linear-gradient(135deg, #eef4ff, #f8fafc); }
        .login-card { max-width: 540px; border: 0; border-radius: 1rem; }
        .campus-banner-image { max-height: 120px; max-width: 100%; object-fit: contain; }
    </style>
</head>
<body class="d-flex align-items-center py-5">
<main class="container">
    <div class="card login-card shadow mx-auto">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <img th:if="${campusSettings.bannerImage != null}" class="campus-banner-image mb-3" th:src="${campusSettings.bannerImage}" alt="Banner cơ sở">
                <h1 class="h3 fw-bold" th:text="${campusSettings.bannerTitle}">Ký túc xá UTC</h1>
                <p class="text-secondary mb-0" th:text="${campusSettings.bannerSubtitle}">Hệ thống quản lý ký túc xá Đại học Giao thông Vận tải</p>
            </div>
            <div th:if="${param.error}" class="alert alert-danger" role="alert">Tên đăng nhập hoặc mật khẩu không đúng, hoặc tài khoản đã bị khóa.</div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">Bạn đã đăng xuất thành công.</div>
            <div th:if="${param.registered}" class="alert alert-success" role="alert">Tạo tài khoản thành công. Đăng nhập để theo dõi yêu cầu thuê phòng của bạn.</div>
            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <input id="username" name="username" class="form-control form-control-lg" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input id="password" name="password" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary btn-lg w-100" type="submit">Đăng nhập</button>
            </form>
            <p class="text-center mt-4 mb-0">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký thuê phòng</a></p>
        </div>
    </div>
</main>
</body>
</html>
