<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Thông tin hóa đơn')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="@{/admin/invoices}" class="text-decoration-none">← Hóa đơn</a><h1 class="page-title mt-2" th:text="${invoice.id == null ? 'Tạo hóa đơn' : 'Cập nhật hóa đơn'}"></h1></div><section class="panel"><form method="post" th:action="@{/admin/invoices/save}" th:object="${invoice}" class="row g-3"><input type="hidden" th:field="*{id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-6"><label class="form-label">Hợp đồng</label><select class="form-select" th:field="*{contractId}"><option value="">Chọn hợp đồng</option><option th:each="c : ${contracts}" th:value="${c.id}" th:text="${c.contractCode + ' — ' + c.tenant.fullName + ' — ' + c.room.roomCode}"></option></select><div class="text-danger small" th:errors="*{contractId}"></div></div><div class="col-md-6"><label class="form-label">Mã hóa đơn (để trống để tự tạo)</label><input class="form-control" th:field="*{invoiceCode}" maxlength="30"></div><div class="col-md-6"><label class="form-label">Kỳ hóa đơn</label><input class="form-control" type="date" th:field="*{billingMonth}"><div class="text-danger small" th:errors="*{billingMonth}"></div></div><div class="col-md-6"><label class="form-label">Hạn thanh toán</label><input class="form-control" type="date" th:field="*{dueDate}"><div class="text-danger small" th:errors="*{dueDate}"></div></div><div class="col-md-4"><label class="form-label">Tiền phòng</label><input class="form-control" type="number" min="0" step="1000" th:field="*{roomPrice}"><div class="text-danger small" th:errors="*{roomPrice}"></div></div><div class="col-md-4"><label class="form-label">Tiền điện</label><input class="form-control" type="number" min="0" step="1000" th:field="*{electricityAmount}"><div class="text-danger small" th:errors="*{electricityAmount}"></div></div><div class="col-md-4"><label class="form-label">Tiền nước</label><input class="form-control" type="number" min="0" step="1000" th:field="*{waterAmount}"><div class="text-danger small" th:errors="*{waterAmount}"></div></div><div class="col-md-4"><label class="form-label">Dịch vụ</label><input class="form-control" type="number" min="0" step="1000" th:field="*{serviceAmount}"><div class="text-danger small" th:errors="*{serviceAmount}"></div></div><div class="col-md-4"><label class="form-label">Khoản khác</label><input class="form-control" type="number" min="0" step="1000" th:field="*{otherAmount}"><div class="text-danger small" th:errors="*{otherAmount}"></div></div><div class="col-md-4"><label class="form-label">Giảm giá</label><input class="form-control" type="number" min="0" step="1000" th:field="*{discount}"><div class="text-danger small" th:errors="*{discount}"></div></div><div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}"></option></select></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">Lưu hóa đơn</button><a class="btn btn-light" th:href="@{/admin/invoices}">Hủy</a></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
