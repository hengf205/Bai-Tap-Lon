<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Hóa đơn')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><h1 class="page-title">Quản lý hóa đơn</h1><p class="page-subtitle mb-0">Tra cứu hóa đơn theo người thuê, thời gian và trạng thái</p><a class="btn btn-primary" href="/admin/invoices/new">Tạo hóa đơn</a></div><section class="panel"><form class="filter-bar mb-3" method="get"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Mã hóa đơn, người thuê, phòng"><input class="form-control" type="number" min="1" max="12" name="month" th:value="${month}" placeholder="Tháng"><input class="form-control" type="number" min="2000" max="2100" name="year" th:value="${year}" placeholder="Năm"><select class="form-select" name="status"><option value="">Tất cả trạng thái</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}" th:selected="${s == selectedStatus}"></option></select><button class="btn btn-primary">Lọc</button></form><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Mã hóa đơn</th><th>Kỳ thu</th><th>Người thuê</th><th>Tổng tiền</th><th>Hạn thanh toán</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="i : ${invoicePage.content}"><td class="fw-semibold" th:text="${i.invoiceCode}"></td><td th:text="${#temporals.format(i.billingMonth, 'MM/yyyy')}"></td><td th:text="${i.contract.tenant.fullName}"></td><td th:text="${#numbers.formatDecimal(i.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td th:text="${i.dueDate}"></td><td><span class="badge text-bg-warning" th:text="${@displayLabels.label(i.status)}"></span></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/invoices/{id}/edit(id=${i.id})}">Sửa</a> <form class="d-inline" method="post" th:action="@{/admin/invoices/{id}/delete(id=${i.id})}" data-confirm="Xóa hóa đơn này?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr><tr th:if="${invoicePage.empty}"><td colspan="6" class="empty-state">Chưa có hóa đơn phù hợp.</td></tr></tbody></table></div><nav th:if="${invoicePage.totalPages > 1}"><ul class="pagination justify-content-end"><li class="page-item" th:classappend="${invoicePage.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/invoices(page=${invoicePage.number - 1},keyword=${keyword},status=${selectedStatus},month=${month},year=${year})}">Trước</a></li><li class="page-item" th:each="n : ${#numbers.sequence(0, invoicePage.totalPages - 1)}" th:classappend="${n == invoicePage.number ? 'active' : ''}"><a class="page-link" th:href="@{/admin/invoices(page=${n},keyword=${keyword},status=${selectedStatus},month=${month},year=${year})}" th:text="${n + 1}"></a></li><li class="page-item" th:classappend="${invoicePage.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/invoices(page=${invoicePage.number + 1},keyword=${keyword},status=${selectedStatus},month=${month},year=${year})}">Sau</a></li></ul></nav></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
