<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Thông tin người thuê')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="@{/admin/tenants}" class="text-decoration-none">← Người thuê</a><h1 class="page-title mt-2" th:text="${tenant.id == null ? 'Thêm người thuê' : 'Cập nhật người thuê'}"></h1></div><section class="panel"><form method="post" th:action="@{/admin/tenants/save}" th:object="${tenant}" class="row g-3"><input type="hidden" th:field="*{id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-6"><label class="form-label">Tài khoản (không bắt buộc)</label><select class="form-select" th:field="*{userId}"><option value="">Chưa liên kết</option><option th:each="u : ${userAccounts}" th:value="${u.id}" th:text="${u.username + ' — ' + u.fullName}"></option></select></div><div class="col-md-6"><label class="form-label">Mã sinh viên</label><input class="form-control" th:field="*{studentCode}" maxlength="20"><div class="text-danger small" th:errors="*{studentCode}"></div></div><div class="col-md-6"><label class="form-label">Họ tên</label><input class="form-control" th:field="*{fullName}" maxlength="100"><div class="text-danger small" th:errors="*{fullName}"></div></div><div class="col-md-6"><label class="form-label">Ngày sinh</label><input class="form-control" type="date" th:field="*{dateOfBirth}"></div><div class="col-md-6"><label class="form-label">Giới tính</label><select class="form-select" th:field="*{gender}"><option value="">Chọn</option><option th:each="g : ${genders}" th:value="${g}" th:text="${@displayLabels.label(g)}"></option></select></div><div class="col-md-6"><label class="form-label">CMND/CCCD</label><input class="form-control" th:field="*{identityCard}" maxlength="20"><div class="text-danger small" th:errors="*{identityCard}"></div></div><div class="col-md-6"><label class="form-label">Điện thoại</label><input class="form-control" th:field="*{phone}" inputmode="numeric"><div class="text-danger small" th:errors="*{phone}"></div></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}"><div class="text-danger small" th:errors="*{email}"></div></div><div class="col-md-6"><label class="form-label">Quê quán</label><input class="form-control" th:field="*{hometown}"></div><div class="col-md-6"><label class="form-label">Trường</label><input class="form-control" th:value="${campusSettings.institutionName}" readonly><div class="form-text">Trường được quản trị viên cấu hình cho cơ sở này.</div></div><div class="col-md-6"><label class="form-label">Ngành học</label><input class="form-control" th:field="*{major}"></div><div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}"></option></select></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">Lưu người thuê</button><a class="btn btn-light" th:href="@{/admin/tenants}">Hủy</a></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
