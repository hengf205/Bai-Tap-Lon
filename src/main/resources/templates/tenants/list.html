<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Người thuê')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><h1 class="page-title">Quản lý người thuê</h1><p class="page-subtitle mb-0">Danh sách sinh viên và người đang lưu trú</p><a class="btn btn-primary" href="/admin/tenants/new">Thêm người thuê</a></div><section class="panel"><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-warning" th:text="${errorMessage}"></div><form class="filter-bar mb-3" method="get"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tên, mã sinh viên, điện thoại"><select class="form-select" name="status"><option value="">Tất cả trạng thái</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}" th:selected="${s == selectedStatus}"></option></select><button class="btn btn-primary">Tìm kiếm</button><a class="btn btn-light" th:href="@{/admin/tenants}">Xóa lọc</a></form><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Mã sinh viên</th><th>Họ tên</th><th>Điện thoại</th><th>Email</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="t : ${tenantPage.content}"><td th:text="${t.studentCode ?: '—'}"></td><td class="fw-semibold" th:text="${t.fullName}"></td><td th:text="${t.phone ?: '—'}"></td><td th:text="${t.email ?: '—'}"></td><td><span class="badge text-bg-success" th:text="${@displayLabels.label(t.status)}"></span></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/tenants/{id}/edit(id=${t.id})}">Sửa</a> <form class="d-inline" method="post" th:action="@{/admin/tenants/{id}/delete(id=${t.id})}" data-confirm="Ngừng hồ sơ và khóa tài khoản người thuê này? Lịch sử hợp đồng sẽ được giữ lại."><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Ngừng</button></form></td></tr><tr th:if="${tenantPage.empty}"><td colspan="5" class="empty-state">Chưa có người thuê phù hợp.</td></tr></tbody></table></div><nav th:if="${tenantPage.totalPages > 1}"><ul class="pagination justify-content-end"><li class="page-item" th:classappend="${tenantPage.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/tenants(page=${tenantPage.number - 1},keyword=${keyword},status=${selectedStatus})}">Trước</a></li><li class="page-item" th:each="n : ${#numbers.sequence(0, tenantPage.totalPages - 1)}" th:classappend="${n == tenantPage.number ? 'active' : ''}"><a class="page-link" th:href="@{/admin/tenants(page=${n},keyword=${keyword},status=${selectedStatus})}" th:text="${n + 1}"></a></li><li class="page-item" th:classappend="${tenantPage.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/tenants(page=${tenantPage.number + 1},keyword=${keyword},status=${selectedStatus})}">Sau</a></li></ul></nav></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
