<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Thông tin hợp đồng')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="@{/admin/contracts}" class="text-decoration-none">← Hợp đồng</a><h1 class="page-title mt-2" th:text="${contract.id == null ? 'Tạo hợp đồng' : 'Cập nhật hợp đồng'}"></h1></div><section class="panel"><form method="post" th:action="@{/admin/contracts/save}" th:object="${contract}" class="row g-3"><input type="hidden" th:field="*{id}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="col-md-6"><label class="form-label">Người thuê</label><select class="form-select" th:field="*{tenantId}"><option value="">Chọn người thuê</option><option th:each="t : ${tenants}" th:value="${t.id}" th:text="${t.fullName + (t.studentCode == null ? '' : ' — ' + t.studentCode)}"></option></select><div class="text-danger small" th:errors="*{tenantId}"></div></div><div class="col-md-6"><label class="form-label">Phòng</label><select class="form-select" th:field="*{roomId}"><option value="">Chọn phòng</option><option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.roomCode + ' (' + @displayLabels.label(r.status) + ')'}"></option></select><div class="text-danger small" th:errors="*{roomId}"></div></div><div class="col-md-6"><label class="form-label">Giường</label><select class="form-select" th:field="*{bedId}"><option value="">Chưa chọn</option><option th:each="b : ${beds}" th:value="${b.id}" th:text="${b.bedCode + ' — ' + b.room.roomCode + ' — ' + @displayLabels.label(b.status)}"></option></select></div><div class="col-md-6"><label class="form-label">Mã hợp đồng (để trống để tự tạo)</label><input class="form-control" th:field="*{contractCode}" maxlength="30"><div class="text-danger small" th:errors="*{contractCode}"></div></div><div class="col-md-6"><label class="form-label">Ngày bắt đầu</label><input class="form-control" type="date" th:field="*{startDate}"><div class="text-danger small" th:errors="*{startDate}"></div></div><div class="col-md-6"><label class="form-label">Ngày kết thúc</label><input class="form-control" type="date" th:field="*{endDate}"><div class="text-danger small" th:errors="*{endDate}"></div></div><div class="col-md-6"><label class="form-label">Tiền phòng hàng tháng</label><input class="form-control" type="number" min="1" step="1000" th:field="*{monthlyPrice}"><div class="text-danger small" th:errors="*{monthlyPrice}"></div></div><div class="col-md-6"><label class="form-label">Tiền cọc</label><input class="form-control" type="number" min="0" step="1000" th:field="*{deposit}"><div class="text-danger small" th:errors="*{deposit}"></div></div><div class="col-md-6"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{status}"><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}"></option></select></div><div class="col-12"><label class="form-label">Ghi chú</label><textarea class="form-control" rows="3" th:field="*{note}"></textarea></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">Lưu hợp đồng</button><a class="btn btn-light" th:href="@{/admin/contracts}">Hủy</a></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
