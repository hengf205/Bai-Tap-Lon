<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Hợp đồng')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><h1 class="page-title">Quản lý hợp đồng</h1><p class="page-subtitle mb-0">Theo dõi thời hạn và trạng thái hợp đồng thuê</p><a class="btn btn-primary" href="/admin/contracts/new">Tạo hợp đồng</a></div><section class="panel"><div class="alert alert-success" th:if="${param.approved}">Đã duyệt yêu cầu và tạo hóa đơn cho người thuê.</div><div class="alert alert-secondary" th:if="${param.rejected}">Đã từ chối yêu cầu và trả giường về danh sách trống.</div><form class="filter-bar mb-3" method="get"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Mã, người thuê hoặc phòng"><select class="form-select" name="status"><option value="">Tất cả trạng thái</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}" th:selected="${s == selectedStatus}"></option></select><button class="btn btn-primary">Tìm kiếm</button></form><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Mã hợp đồng</th><th>Người thuê</th><th>Phòng</th><th>Thời hạn</th><th>Tiền/tháng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="c : ${contractPage.content}"><td class="fw-semibold" th:text="${c.contractCode}"></td><td th:text="${c.tenant.fullName}"></td><td th:text="${c.room.roomCode}"></td><td><span th:text="${c.startDate}"></span> – <span th:text="${c.endDate}"></span></td><td th:text="${#numbers.formatDecimal(c.monthlyPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td><td><span class="badge text-bg-primary" th:text="${c.status.name() == 'PENDING' and pendingInvoiceContractIds.contains(c.id) ? 'Đã duyệt · chờ thanh toán' : @displayLabels.label(c.status)}"></span></td><td class="text-nowrap">
<form class="d-inline" th:if="${c.status.name() == 'PENDING' and !pendingInvoiceContractIds.contains(c.id)}" method="post" th:action="@{/admin/contracts/{id}/approve(id=${c.id})}" data-confirm="Duyệt yêu cầu này và tạo hóa đơn tiền phòng, tiền cọc?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-success">Duyệt và tạo hóa đơn</button></form>
<form class="d-inline" th:if="${c.status.name() == 'PENDING'}" method="post" th:action="@{/admin/contracts/{id}/reject(id=${c.id})}" data-confirm="Từ chối yêu cầu thuê này?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Từ chối</button></form>
<a class="btn btn-sm btn-outline-primary" th:if="${c.status.name() != 'PENDING'}" th:href="@{/admin/contracts/{id}/edit(id=${c.id})}">Sửa</a>
<form class="d-inline" th:if="${c.status.name() == 'ACTIVE'}" method="post" th:action="@{/admin/contracts/{id}/finish(id=${c.id})}" data-confirm="Kết thúc hợp đồng này?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-danger">Kết thúc</button></form>
</td></tr><tr th:if="${contractPage.empty}"><td colspan="7" class="empty-state">Chưa có hợp đồng phù hợp.</td></tr></tbody></table></div><nav th:if="${contractPage.totalPages > 1}"><ul class="pagination justify-content-end"><li class="page-item" th:classappend="${contractPage.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/contracts(page=${contractPage.number - 1},keyword=${keyword},status=${selectedStatus})}">Trước</a></li><li class="page-item" th:each="n : ${#numbers.sequence(0, contractPage.totalPages - 1)}" th:classappend="${n == contractPage.number ? 'active' : ''}"><a class="page-link" th:href="@{/admin/contracts(page=${n},keyword=${keyword},status=${selectedStatus})}" th:text="${n + 1}"></a></li><li class="page-item" th:classappend="${contractPage.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/admin/contracts(page=${contractPage.number + 1},keyword=${keyword},status=${selectedStatus})}">Sau</a></li></ul></nav></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
