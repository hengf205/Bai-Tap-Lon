<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout-head :: head('Sự cố')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><div><h1 class="page-title">Quản lý sự cố</h1><p class="page-subtitle mb-0">Tiếp nhận và cập nhật tiến độ xử lý sự cố</p></div><a class="btn btn-primary" href="/manager/incidents/new">Báo sự cố</a></div><section class="panel"><form class="filter-bar mb-3" method="get" th:action="@{/manager/incidents}"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tiêu đề, phòng, người báo"><select class="form-select" name="status"><option value="">Mọi trạng thái</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}" th:selected="${s == selectedStatus}"></option></select><button class="btn btn-primary">Lọc</button></form><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Tiêu đề</th><th>Phòng</th><th>Người báo</th><th>Mức độ</th><th>Ngày báo</th><th>Trạng thái</th><th sec:authorize="hasAnyRole('ADMIN','MANAGER')">Cập nhật</th></tr></thead><tbody><tr th:each="i : ${incidentPage.content}"><td class="fw-semibold" th:text="${i.title}"></td><td th:text="${i.room.roomCode}"></td><td th:text="${i.tenant == null ? 'Quản lý' : i.tenant.fullName}"></td><td><span class="badge" th:classappend="${i.priority.name() == 'URGENT' ? ' text-bg-danger' : (i.priority.name() == 'HIGH' ? ' text-bg-warning' : ' text-bg-secondary')}" th:text="${@displayLabels.label(i.priority)}"></span></td><td th:text="${#temporals.format(i.createdAt, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${@displayLabels.label(i.status)}"></td><td sec:authorize="hasAnyRole('ADMIN','MANAGER')"><form method="post" th:action="@{/manager/incidents/{id}/status(id=${i.id})}" class="d-flex gap-2"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select class="form-select form-select-sm" name="status"><option th:each="s : ${statuses}" th:value="${s}" th:text="${@displayLabels.label(s)}" th:selected="${s == i.status}"></option></select><button class="btn btn-sm btn-outline-primary">Lưu</button></form></td></tr><tr th:if="${incidentPage.empty}"><td colspan="7" class="empty-state">Chưa có sự cố phù hợp.</td></tr></tbody></table></div><nav th:if="${incidentPage.totalPages > 1}"><ul class="pagination justify-content-end"><li class="page-item" th:classappend="${incidentPage.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/manager/incidents(page=${incidentPage.number - 1},keyword=${keyword},status=${selectedStatus})}">Trước</a></li><li class="page-item" th:each="n : ${#numbers.sequence(0, incidentPage.totalPages - 1)}" th:classappend="${n == incidentPage.number ? 'active' : ''}"><a class="page-link" th:href="@{/manager/incidents(page=${n},keyword=${keyword},status=${selectedStatus})}" th:text="${n + 1}"></a></li><li class="page-item" th:classappend="${incidentPage.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/manager/incidents(page=${incidentPage.number + 1},keyword=${keyword},status=${selectedStatus})}">Sau</a></li></ul></nav></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
