<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout-head :: head('Báo sự cố')}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="app-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="main-content"><div class="mb-4"><a th:href="${tenantReport == true ? '/tenant/dashboard' : '/manager/incidents'}" class="text-decoration-none">← Quay lại</a><h1 class="page-title mt-2">Báo sự cố</h1><p class="page-subtitle">Mô tả tình trạng để ban quản lý hỗ trợ bạn</p></div><section class="panel"><form method="post" th:action="${tenantReport == true ? '/tenant/incidents/save' : '/manager/incidents/save'}" th:object="${incident}" class="row g-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:if="${tenantReport == true}" th:field="*{tenantId}"><div class="col-md-6"><label class="form-label">Phòng</label><select class="form-select" th:field="*{roomId}" th:disabled="${tenantReport == true}" required><option value="">Chọn phòng</option><option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.roomCode}"></option></select><input th:if="${tenantReport == true}" type="hidden" th:field="*{roomId}"><div class="text-danger small" th:errors="*{roomId}"></div></div><div class="col-md-6"><label class="form-label">Mức độ ưu tiên</label><select class="form-select" th:field="*{priority}"><option th:each="p : ${priorities}" th:value="${p}" th:text="${@displayLabels.label(p)}"></option></select><div class="text-danger small" th:errors="*{priority}"></div></div><div class="col-12"><label class="form-label">Tiêu đề</label><input class="form-control" th:field="*{title}" maxlength="200" placeholder="Ví dụ: Vòi nước bị rò rỉ"><div class="text-danger small" th:errors="*{title}"></div></div><div class="col-12"><label class="form-label">Mô tả chi tiết</label><textarea class="form-control" rows="5" th:field="*{description}" maxlength="2000"></textarea><div class="text-danger small" th:errors="*{description}"></div></div><div class="col-12"><label class="form-label">Đường dẫn ảnh (nếu có)</label><input class="form-control" th:field="*{image}" maxlength="255"></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary">Gửi báo sự cố</button><a class="btn btn-light" th:href="${tenantReport == true ? '/tenant/dashboard' : '/manager/incidents'}">Hủy</a></div></form></section></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
